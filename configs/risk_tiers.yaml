# Clinical risk tiers of the finding codes scored by the validation harness
# (TZ §16: "critical findings — recall above a high threshold, priority over
# specificity"; application review, blocker 1: error analysis by risk category).
#
# A per-finding sensitivity table treats a missed STEMI and a missed sinus
# tachycardia alike. Clinical review does not. The harness therefore also pools
# every miss and every false call by the consequence of the error:
#
#   critical — TZ §10 must-not-miss findings: a miss can cost a life within hours;
#              a false alert costs an urgent physician read (acceptable, bounded)
#   major    — findings that change management (anticoagulation, referral, drug
#              review): a miss delays treatment, a false call starts a work-up
#   minor    — descriptive findings corrected at the next routine read
#
# `targets` are the acceptance thresholds the protocol (docs/VALIDATION_PROTOCOL.md)
# sets for a held-out, physician-adjudicated set. Against the open databases'
# labels they are reported, not claimed: those labels are not adjudicated outcomes.
tiers:
  critical: [st_elevation, complete_av_block, long_qt, peaked_t_waves]
  major: [atrial_fibrillation, atrial_flutter, lbbb, wpw_preexcitation, st_depression, lvh]
  minor: [sinus_rhythm, sinus_bradycardia, sinus_tachycardia, first_degree_av_block, rbbb,
          left_axis_deviation, right_axis_deviation, low_qrs_voltage]
targets:
  # case-level: a case carrying any gold label of the tier is "caught" when the
  # system reports any label of the tier (mode B escalates on any critical finding)
  critical: {case_sensitivity: 0.90, case_false_alert_rate: 0.05}
  major: {case_sensitivity: 0.80, case_false_alert_rate: 0.10}
  minor: {case_sensitivity: 0.70, case_false_alert_rate: 0.20}
