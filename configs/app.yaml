# CardioLens application configuration.
# Nothing algorithmic is hard-coded in the source; runtime behaviour is driven
# from this file (TZ §0: "Ничего не хардкодь, где нужны конфиги").

# Operating mode (TZ §2).
#   A = decision support (default, safe). B = autonomous (gated).
mode: "A"

# Mains interference to reject (TZ §5). 50 Hz for Uzbekistan; 60 for US grid.
mains_frequency_hz: 50

preprocessing:
  target_sampling_rate_hz: 500
  bandpass_low_hz: 0.5      # baseline-wander removal
  bandpass_high_hz: 40.0    # keep ST intact, remove HF noise
  # Signal Quality Index below this marks a lead as low-quality (0..1).
  sqi_accept_threshold: 0.5
  # CardioLens interprets resting ECGs (~10 s). Longer recordings (Holter) are
  # analysed on their first max_analysis_s seconds, with a note in the audit log:
  # delineation time grows faster than linearly with the beat count (a 30-min
  # INCART record took > 20 min; D37).
  max_analysis_s: 60

# Additive calibration (ms) for the delineator's systematic fiducial bias,
# measured against LUDB expert annotations (DECISIONS.md D15a): the dwt
# delineator places P onset ~34 ms late (PR under-measured) and the QRS
# boundaries ~8 ms wide. These offsets re-centre the intervals; set to 0 to
# disable. NOT a clinical threshold change — the thresholds stay put.
delineation_correction:
  # PR is under-measured by ~34 ms (LUDB bias -34; the synthetic ground truth
  # agrees, MAE 41->7 after this offset). Correcting it recovers first-degree
  # AV block (sens 0.17->0.42 on the PTB-XL subset) without touching the >200 ms
  # clinical threshold.
  pr_ms: 34.0
  # QRS and QT left uncorrected. The QRS bias is smaller (+8 ms) with high
  # per-record variance (MAE 16), and a global -8 ms offset trims genuinely-wide
  # complete-RBBB below the block threshold (rbbb sens 0.50->0.37) for little net
  # gain — BBB specificity is already handled by qrs_complete_block. The LUDB QT
  # bias (~-11 ms) disagrees with the synthetic ground truth, so a global QT
  # offset does more harm than good.
  qrs_ms: 0.0
  # Global QT (12-lead median beat, capped tangent T end; D30) reads short against
  # GE 12SL global QT by a constant 30 ms on PTB-XL development folds (938 records;
  # LUDB expert global QT: -48 ms). Calibrated to 12SL — at +48 long-QT
  # specificity collapsed on development data.
  global_qt_ms: 30.0
  # Global PR (12-lead median beat, P onset at 10% of the RMS P peak; D30) reads
  # short by 12 ms against GE 12SL (LUDB expert global PR: -14 ms — they agree).
  global_pr_ms: 12.0
  qt_ms: 0.0

# Pause / dropped-beat thresholds (TZ §7.1, §10). A pause is flagged when the
# longest RR gap exceeds finding_ms OR is >= ratio× the median beat (a dropped
# beat / sinus arrest / blocked P); >= critical_ms is a must-not-miss (asystole
# risk). Config, not code (§0).
pause:
  finding_ms: 2000       # absolute pause worth reporting
  ratio: 1.8             # RR >= 1.8× median -> likely dropped beat
  critical_ms: 3000      # >=3 s -> critical (§10)

# Paced rhythm: a pacemaker spike is an extreme slope outlier on the raw signal.
# spike_ratio = max|diff| / p99|diff|; >= this flags paced rhythm. Tuned on
# PTB-XL (60 PACE vs 60 SR): 5.5 is the knee — sens 0.83 / spec 0.95 / PPV 0.94,
# the highest sensitivity that still holds specificity at 0.95 (DECISIONS.md).
# D24: an artifact spike also makes an extreme outlier, so the spike must be
# time-locked to the QRS (5-200 ms before R) on >= coupling_min of the beats.
# Development data: all 40 false paced calls had coupling <= 0.10.
pacing:
  spike_ratio_min: 5.5
  coupling_min: 0.20
  # D75: or a spike-shaped event seen by >= 6 leads at once (|second difference| > 3x the
  # lead's p99), QRS-locked on >= 30% of beats. Development: no new false calls on PTB-XL,
  # Georgia or CPSC non-paced records (the slope version, D74, took narrow-QRS upstrokes).
  multilead_k: 3.0
  multilead_min_leads: 6
  multilead_coupling_min: 0.30

# Signal-organization quality gate (TZ §5). Beat-template consistency is the
# median correlation of each QRS to the median beat: high for real ECG (incl.
# AFib, ~0.98) but low for band-limited noise/artifact (~0.6-0.75), which the
# HF-based SQI misses because the band-pass smooths broadband noise into the ECG
# band. Below this the R-peaks are unreliable, so the R-peak-derived findings are
# withheld (a poor_quality_signal finding replaces them) instead of reporting a
# bradycardia read off noise. 0.80 with the +-90ms template window keeps ~95% of real ECG (incl. AFib, p10 ~0.96) while noise falls below 0.78,
# while catching pure noise (validated, DECISIONS D15w).
quality:
  beat_consistency_min: 0.80
  # Paper-ECG digitisation (§4): a trace recovered from a degraded image (the
  # adaptive-mask path caps provenance.confidence at 0.5; sparse traces lower it
  # via column coverage) is not interpreted as if it were a digital recording —
  # below this quality_ok is forced low so mode B escalates (DECISIONS D15y).
  digitized_confidence_min: 0.80
  # LA/RA electrode reversal (D116): P inverted in lead I (< -la_ra_p_uv) and P in aVR
  # above P in aVL by la_ra_p_uv, on the median beat. The QRS-only rule (lead I QRS
  # negative, aVR positive) flagged physiological right axis (children 13%) and is the
  # fallback only when there is no organised P (AF, flutter, pacing, no P waves).
  la_ra_p_uv: 10.0

# Critical-alert tiers (TZ §10). QTc above the sex-specific limit (450/460 ms)
# is reported as long QT on ~20% of resting ECGs — GE 12SL flags the same share
# of PTB-XL — so the critical alert (forced escalation) starts at the guideline
# high-risk threshold for torsades instead (D44; product-owner decision).
safety:
  long_qt_critical_qtc_ms: 500
  # Peaked T waves fired on ~14% of ECGs (even GE 12SL's own T/R meet that rule on
  # ~10%). The finding stays; the critical hyperkalaemia alert needs a tall T on
  # the median beat (>= 1.0 mV precordial or >= 0.6 mV limb, >= 2 leads; ~3% of
  # ECGs, agrees with 12SL sens 0.85 / false 0.2%) or serum K+ >= 5.5 mmol/L in
  # the clinical context (D49; product-owner decision).
  tall_t_precordial_uv: 1000
  tall_t_limb_uv: 600
  hyperkalaemia_potassium_mmol: 5.5
  # Severe bradycardia: median rate below 40/min; under 1 year below 60/min (PALS, D101 —
  # option (c), chosen under the owner's standing delegation). Transient episodes in
  # infants are a finding that escalates mode B, not an alert.
  severe_bradycardia_bpm: 40
  severe_bradycardia_infant_bpm: 60

# Confidence gating for autonomous mode B (TZ §2, §16).
confidence:
  # Autonomous report is emitted only if overall confidence >= this.
  autonomous_min_overall: 0.85
  # Per-finding confidence floor for autonomous mode (enforced since D85).
  autonomous_min_component: 0.70
  # D85: a finding never reports more confidence than its PPV earned on development
  # data — the higher of PTB-XL fold 9 and Georgia 988 (benefit of the doubt across
  # label conventions), where the declared value exceeded it by > 0.10; floor 0.30.
  # Each cap is below the component floor, so these findings escalate mode B.
  finding_caps:
    atrial_fibrillation: 0.51     # dev PPV 0.51 / 0.39 (declared 0.6-0.8)
    first_degree_av_block: 0.41   # 0.27 / 0.41 (declared 0.85)
    incomplete_rbbb: 0.44         # 0.44 / 0.26 (0.60)
    lbbb: 0.61                    # 0.50 / 0.61 (0.72)
    rvh: 0.30                     # 0.10 / 0.22 (0.60-0.75)
    st_depression: 0.30           # 0.13 / 0.02 (0.75)
    st_elevation: 0.30            # 0.00 / 0.08 (0.80); a STEMI-pattern alert escalates anyway
    # D86: not scored on PTB-XL — same rule on Georgia 988 alone (held-out Georgia d62 passed).
    long_qt: 0.30                 # PPV 0.26 (0.85); QTc >= 500 ms stays a critical alert
    low_qrs_voltage: 0.43         # 0.43 (0.60)
    right_axis_deviation: 0.30    # 0.14 (0.70)
    t_inversion: 0.30             # 0.16 (0.65)

# Disclaimers surfaced in every report (TZ §2, §10).
disclaimers:
  ru: "Инструмент поддержки принятия решений. Не заменяет врача."
  uz: "Qaror qabul qilishni qo'llab-quvvatlash vositasi. Shifokor o'rnini bosmaydi."

# Versioning for traceability / regulator-readiness (TZ §1, §11).
versions:
  schema: "0.1.0"
  rules_base: "pathophysiology-0.1.0"
