# Adult ECG reference norms (TZ §6 "движок норм по возрасту/полу").
# Values are intentionally editable config, not code constants.
# Ranges are [low, high]; durations in milliseconds, rates in bpm.
age_group: "adult"
applies_when:
  age_years_min: 16

heart_rate_bpm: [60, 100]

# Above this rate a REGULAR NARROW-complex tachycardia is flagged as
# supraventricular tachycardia (SVT) rather than sinus tachycardia: resting
# sinus tachycardia rarely exceeds ~140/min, so a regular narrow tachy at/above
# this rate is SVT/AT/flutter-2:1 until proven otherwise (guideline threshold).
# Validated on PTB-XL SVTAC/PSVT + Chapman SVT vs sinus tach (55 vs 114):
# sens 0.47 / spec 1.00. Adult-only key — children have high physiologic rates
# (the pediatric norm table omits it, so the rule never fires for them).
svt_rate_min: 140

intervals_ms:
  pr: [120, 200]
  qrs: [70, 110]
  qt: [350, 450]
  # Complete bundle-branch block requires a fully widened QRS; 110–120 ms is a
  # nonspecific/incomplete conduction delay, not a complete block.
  qrs_complete_block: 120
  # First-degree AV block is called when >=this many leads agree PR > upper norm
  # (a single lead under-measures PR; multi-lead agreement filters artefacts).
  pr_prolonged_min_leads: 2
  # QTc thresholds are sex-specific below.

qtc_ms:
  # Bazett-corrected upper limits (TZ §6).
  male_upper: 450
  female_upper: 460
  short_lower: 350

axis_deg:
  qrs_normal: [-30, 90]
  extreme_low: -90      # below this = extreme/northwest axis
  extreme_high: 180

voltage_uv:
  # LVH voltage criteria (Sokolow-Lyon: SV1 + RV5/RV6), microvolts.
  sokolow_lyon_lvh: 3500
  # Low QRS voltage: limb-lead QRS peak-to-peak below this (µV).
  low_voltage_limb: 500

# Right ventricular hypertrophy: dominant R in V1 (R/S > this), with right-axis
# support. RBBB also gives a dominant V1 R, so it is excluded in the rule.
rvh:
  v1_rs_ratio: 1.0

st_uv:
  # ST deviation thresholds, microvolts, measured at J+60 ms (the SCP-ECG
  # ST-amplitude convention — the J point alone under-reads elevation and misses
  # most true STE; keying elevation on J+60 lifts sensitivity 0.14->0.29 while
  # the lead-specific precordial threshold below holds specificity, see D15j).
  elevation_significant: 100          # general limb / precordial leads (0.1 mV)
  # V2-V3 sit over the anterior wall where early-repolarisation routinely lifts
  # the ST 0.1-0.2 mV in healthy hearts; ACC/ESC require 0.2 mV there for STEMI.
  elevation_significant_v2v3: 200
  depression_significant: 100

# P-wave criteria for atrial enlargement (ecglibrary / 150 ECG Problems).
p_wave:
  duration_upper_ms: 120       # > 120 ms -> left atrial enlargement (P-mitrale)
  amplitude_upper_uv: 250      # > 250 µV in lead II -> right atrial enlargement (P-pulmonale)
