# Pediatric ECG reference norms (TZ §6, Rijnbeek/Davignon style).
# Age-dependent — adult models transfer poorly to children (TZ §15).
# Simplified age bands for MVP; expand per Davignon tables in later increments.
age_group: "pediatric"
applies_when:
  age_years_max: 15

# Heart-rate norms are strongly age-dependent (bpm).
heart_rate_bpm_by_age:
  - { age_days_max: 30, range: [90, 180] }        # neonate
  - { age_years_max: 1, range: [100, 170] }        # infant
  - { age_years_max: 3, range: [90, 150] }
  - { age_years_max: 8, range: [70, 120] }
  - { age_years_max: 15, range: [60, 110] }

rhythm:
  atrial_flutter_bpm: [200, 350]
  # Atrial fibrillation gates: RR coefficient of variation above, and fraction of
  # beats with an organised P below. Chosen on the train half of 964 PhysioNet
  # ecg-arrhythmia records with a specificity floor and confirmed on the test half
  # and PTB-XL (AF-or-flutter family: spec >= 0.92 everywhere, sensitivity
  # 0.50 -> 0.62 on PTB-XL). The old (0.15, 0.30) was tuned on 300 records.
  af_rr_cv_min: 0.10
  af_p_ratio_max: 0.5
  # Conducted P: refined P onset on >= 50 % of beats with beat-to-beat PR SD below
  # this excludes AF (same physiology as the AV-dissociation gate, D26/D28).
  af_pr_std_max_ms: 40

intervals_ms:
  pr: [90, 170]        # shorter than adult (fallback when no band matches)
  qrs: [50, 90]
  qt: [300, 440]
  # A bundle branch block is called from this width, not from the band's upper
  # normal: the 9-15 y upper normal (~100 ms) is far below the adult BBB
  # threshold and read 13 % of teenagers as LBBB (D44).
  qrs_bbb: 110

# Upper normals by age band (98th percentiles; QRS from the 1838-record
# ecg-arrhythmia pediatric cohort with this envelope measurement, PR/QT from
# Davignon/Rijnbeek as reproduced in pediatric references, rounded). Band = first
# entry whose age limit the patient is under.
intervals_ms_by_age:
  - { age_days_max: 30,  pr: [70, 140], qrs: [40, 80],  qt: [250, 400] }
  - { age_years_max: 1,  pr: [70, 150], qrs: [40, 80],  qt: [250, 400] }
  - { age_years_max: 3,  pr: [80, 150], qrs: [45, 85],  qt: [270, 420] }
  - { age_years_max: 8,  pr: [90, 170], qrs: [50, 100], qt: [290, 430] }
  - { age_years_max: 15, pr: [90, 180], qrs: [55, 105], qt: [300, 440] }

qtc_ms:
  formula: fridericia
  upper: 460
  # 2nd percentile of Fridericia QTc in the pediatric cohort is 321-329 ms; the
  # adult 340 flagged 12 % of 4-8-year-olds as short QT (D44).
  short_lower: 320

# Right-axis deviation is a normal variant in neonates/infants (TZ §6), so the
# pediatric normal QRS-axis range is intentionally wide to avoid over-calling.
axis_deg:
  qrs_normal: [-30, 180]
  extreme_low: -90
  extreme_high: 210

voltage_uv:
  low_voltage_limb: 400
  # Age-band 98th-percentile QRS voltages (µV) after Davignon et al. 1979/80 as
  # reproduced in pediatric ECG references (Park), rounded to the bands used here —
  # APPROXIMATE transcriptions, not a re-derivation. Adult LVH voltage criteria are
  # not applied to children: a tall R is normal. LVH = RV6 or SV1 above the band's
  # 98th percentile with a supporting sign (strain / left axis) or both voltages;
  # RVH = RV1 and SV6 both above, or one with right axis deviation.
  pediatric_98th_by_age:
    - { label: "neonate <=30 d", age_days_max: 30,  r_v1: 2400, s_v1: 2000, r_v6: 1400, s_v6: 1000 }
    - { label: "infant <=1 y",  age_years_max: 1,  r_v1: 2000, s_v1: 1800, r_v6: 2200, s_v6: 900 }
    - { label: "1-3 y",         age_years_max: 3,  r_v1: 1800, s_v1: 2100, r_v6: 2300, s_v6: 700 }
    - { label: "3-8 y",         age_years_max: 8,  r_v1: 1600, s_v1: 2300, r_v6: 2600, s_v6: 500 }
    - { label: "8-15 y",        age_years_max: 15, r_v1: 1100, s_v1: 2500, r_v6: 2400, s_v6: 400 }

st_uv:
  # Same J-point/plateau logic as adults; V2-V3 use a single 150 µV threshold.
  elevation_significant: 100
  elevation_v2_v3: { male_under_40: 150, male: 150, female: 150 }
  elevation_plateau_fraction: 0.8
  # Neutral descriptor st_elevation_any: flat 1 mm in any lead (J and J+60), no
  # sex/age V2-V3 thresholds; under BBB/LVH/WPW a discordant lead counts only from
  # any_elevation_discordant_uv (Sgarbossa-like). Chosen on PTB-XL STE_ (28) and
  # ecg-arrhythmia "ST tilt up" (58): sens 0.18 -> 0.61 and 0.81 -> 0.83 at the
  # same specificity (0.80 / 0.82) — see D37.
  any_elevation_uv: 100
  any_elevation_discordant_uv: 200
  depression_significant: 100
  depression_upsloping_uv: 50

# Clinically important pediatric caveat (TZ §7.2):
# T-wave inversion in V1-V4 is NORMAL in children ("juvenile T-wave pattern").
normal_variants:
  juvenile_t_inversion_leads: ["V1", "V2", "V3", "V4"]
