# Pediatric ECG reference norms (TZ §6, Rijnbeek/Davignon style).
# Age-dependent — adult models transfer poorly to children (TZ §15).
# Simplified age bands for MVP; expand per Davignon tables in later increments.
age_group: "pediatric"
applies_when:
  age_years_max: 15

# Heart-rate norms are strongly age-dependent (bpm).
heart_rate_bpm_by_age:
  - { age_days_max: 30, range: [90, 180] }        # neonate
  - { age_years_max: 1, range: [100, 170] }        # infant
  - { age_years_max: 3, range: [90, 150] }
  - { age_years_max: 8, range: [70, 120] }
  - { age_years_max: 15, range: [60, 110] }

# Bradycardia episodes (D101): under this age, a slowest instantaneous rate (longest RR)
# below the age norm is reported even when the strip's median rate is normal
# (preterm/newborn apnoea-bradycardia; dev: picsdb infants 1-5).
bradycardia_episode_max_age_years: 1

# Pediatric SVT (D95). Children reach high sinus rates, so the adult svt_rate_min rule
# does not apply. A regular narrow tachycardia above the age norm is called SVT when P
# waves are missing before part of the beats (P ratio below svt_p_ratio_max; dev:
# Leipzig EP children, SVT 0.70 median vs sinus >= 0.88), or at the PALS rates.
svt_p_ratio_max: 0.85
svt_rate_pals:
  infant: 220     # under 1 year
  child: 180      # from 1 year

intervals_ms:
  pr: [90, 170]        # shorter than adult
  qrs: [50, 90]
  qt: [300, 440]
  qrs_complete_block: 100   # narrower QRS in children (age-dependent)
  pr_prolonged_min_leads: 2

qtc_ms:
  upper: 460
  short_lower: 340

# Right-axis deviation is a normal variant in neonates/infants (TZ §6), so the
# pediatric normal QRS-axis range is intentionally wide to avoid over-calling.
axis_deg:
  qrs_normal: [-30, 180]
  # Newborns (D114): pECG-Norm, 379 normal 0-30 d, axis p97.5 194 deg; upper 180
  # flagged 5.8% of normal newborns as right-axis deviation, 195 flags 1.8%.
  # From 31 days the p97.5 is 112 deg, so the general range stays.
  qrs_normal_by_age:
    - { age_days_max: 30, range: [-30, 195] }
  extreme_low: -90
  extreme_high: 210

# Peaked-T finding (D118): children have taller T waves. On ZZU-pECG dev the adult
# limit (T > 400 uV and > half the largest QRS deflection, >= 2 leads) fired on 12% of
# normal children; 600 uV fires on 5.8%. The critical hyperkalaemia alert keeps its
# own tall-T criterion (safety.tall_t_*), unchanged.
peaked_t:
  min_uv: 600
  qrs_ratio: 0.5

voltage_uv:
  low_voltage_limb: 400

# Clinically important pediatric caveat (TZ §7.2):
# T-wave inversion in V1-V4 is NORMAL in children ("juvenile T-wave pattern").
normal_variants:
  juvenile_t_inversion_leads: ["V1", "V2", "V3", "V4"]
