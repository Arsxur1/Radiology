# Pediatric ECG reference norms (TZ §6, Rijnbeek/Davignon style).
# Age-dependent — adult models transfer poorly to children (TZ §15).
# Simplified age bands for MVP; expand per Davignon tables in later increments.
age_group: "pediatric"
applies_when:
  age_years_max: 15

# Heart-rate norms are strongly age-dependent (bpm).
heart_rate_bpm_by_age:
  - { age_days_max: 30, range: [90, 180] }        # neonate
  - { age_years_max: 1, range: [100, 170] }        # infant
  - { age_years_max: 3, range: [90, 150] }
  - { age_years_max: 8, range: [70, 120] }
  - { age_years_max: 15, range: [60, 110] }

rhythm:
  atrial_flutter_bpm: [200, 350]
  # Atrial fibrillation gates: RR coefficient of variation above, and fraction of
  # beats with an organised P below. Chosen on the train half of 964 PhysioNet
  # ecg-arrhythmia records with a specificity floor and confirmed on the test half
  # and PTB-XL (AF-or-flutter family: spec >= 0.92 everywhere, sensitivity
  # 0.50 -> 0.62 on PTB-XL). The old (0.15, 0.30) was tuned on 300 records.
  af_rr_cv_min: 0.10
  af_p_ratio_max: 0.5
  # Conducted P: refined P onset on >= 50 % of beats with beat-to-beat PR SD below
  # this excludes AF (same physiology as the AV-dissociation gate, D26/D28).
  af_pr_std_max_ms: 40

intervals_ms:
  pr: [90, 170]        # shorter than adult
  qrs: [50, 90]
  qt: [300, 440]

qtc_ms:
  formula: fridericia
  upper: 460
  short_lower: 340

# Right-axis deviation is a normal variant in neonates/infants (TZ §6), so the
# pediatric normal QRS-axis range is intentionally wide to avoid over-calling.
axis_deg:
  qrs_normal: [-30, 180]
  extreme_low: -90
  extreme_high: 210

voltage_uv:
  low_voltage_limb: 400

st_uv:
  # Same J-point/plateau logic as adults; V2-V3 use a single 150 µV threshold.
  elevation_significant: 100
  elevation_v2_v3: { male_under_40: 150, male: 150, female: 150 }
  elevation_plateau_fraction: 0.8
  depression_significant: 100
  depression_upsloping_uv: 50

# Clinically important pediatric caveat (TZ §7.2):
# T-wave inversion in V1-V4 is NORMAL in children ("juvenile T-wave pattern").
normal_variants:
  juvenile_t_inversion_leads: ["V1", "V2", "V3", "V4"]
