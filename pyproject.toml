[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiolens"
version = "0.1.0"
description = "CardioLens — ECG detection and interpretation system (MVP)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "networkx",
    "wfdb",
    "pyedflib",
    "neurokit2",
    "matplotlib",
    "reportlab",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
llm = ["anthropic"]
validation = ["pandas"]
digitize = ["opencv-python-headless"]
dicom = ["pydicom>=3"]
dev = ["pytest", "pytest-cov", "ruff", "httpx", "opencv-python-headless", "pydicom>=3"]

[tool.setuptools.packages.find]
where = ["src"]

# The web UI ships inside the package (D112); configs/ stays at the repository root and is
# located through CARDIOLENS_CONFIG_DIR when installed non-editably (Dockerfile does this).
[tool.setuptools.package-data]
cardiolens = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Declare the source layout so first-party import detection is deterministic
# across environments (CI vs local editable install).
src = ["src", "tests"]

[tool.ruff.lint]
# Ignore idiomatic patterns: dict() kwargs for readability, deliberate broad
# excepts around best-effort DSP, FastAPI Form()/File() default-arg idiom,
# guard-clause boolean returns, and int() casts kept for clarity.
ignore = ["C408", "BLE001", "B008", "SIM103", "RUF046"]

[tool.ruff.lint.isort]
# Pin cardiolens as first-party so isort grouping never depends on whether the
# package happens to be pip-installed in the runner (fixes CI I001 drift).
known-first-party = ["cardiolens"]

# Coverage of the core (§16 "покрытие тестами ядра — задать порог", D92):
# `pytest --cov=cardiolens` fails below the threshold. CLI entry points that only
# drive offline datasets are left out.
[tool.coverage.run]
omit = ["*/cardiolens/demo.py", "*/cardiolens/train_beats.py", "*/cardiolens/validate.py"]

[tool.coverage.report]
fail_under = 85

