[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiolens"
version = "0.1.0"
description = "CardioLens — ECG detection and interpretation system (MVP)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "networkx",
    "wfdb",
    "pyedflib",
    "neurokit2",
    "matplotlib",
    "reportlab",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
llm = ["anthropic"]
validation = ["pandas"]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ignore idiomatic patterns: dict() kwargs for readability, deliberate broad
# excepts around best-effort DSP, FastAPI Form()/File() default-arg idiom,
# guard-clause boolean returns, and int() casts kept for clarity.
ignore = ["C408", "BLE001", "B008", "SIM103", "RUF046"]
