[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiolens"
version = "0.1.0"
description = "CardioLens — ECG detection and interpretation system (MVP)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "networkx",
    "wfdb",
    "pyedflib",
    "neurokit2",
    "matplotlib",
    "reportlab",
]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
